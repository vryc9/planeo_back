spring.application.name=planeo_back
--spring.profiles.active=dev
server.port=8082

# Configuration BDD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

#Servlet
server.servlet.contextPath=/api

# Kafka (suppression de compte : outbox -> account.deletion.requested)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.group-id=planeo-back-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Suppression de compte
# Age maximum de la derniere re-authentification (header X-Auth-Reauth-At pose par la gateway)
planeo.account-deletion.reauth-max-age-seconds=300
planeo.outbox.poll-interval-ms=1000
planeo.outbox.batch-size=50
planeo.outbox.retention-days=7
